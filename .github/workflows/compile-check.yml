name: compile-check
# Compile-verification loop, ported from TaCZ_Refabricated_Unofficial (.github/workflows/compile-check.yml)
# via the 26.3 branch of this repository.
#
# 依赖下载与编译在 GitHub Actions（外网畅通）执行；arena/** 分支上，编译日志通过
# GitHub Contents API 写回本分支（build-reports/compile-java.log），供网络受限的沙箱
# 用 `gh api .../contents/build-reports/compile-java.log` 直接读取 —— 绕开 Actions
# 日志 blob 域不可达的限制。沙箱里 maven.fabricmc.net / piston-meta.mojang.com 不可达，
# ./gradlew 连依赖都解析不了，所以这是 26.1.2 这条线上唯一能「编译验证」的通道
# （26.3 分支同理，本文件与它逐字节对应，只有分支过滤与注释不同）。
#
# 沿用姊妹仓的三条教训：
#   * v2 用 git commit+push 回推，曾因 rebase/push 竞争连续失败 5 次 → 改用 Contents API 单文件写入；
#   * paths-ignore 'build-reports/**' 防止「日志回推 commit」再次触发本流程造成死循环；
#   * 只有 arena/** 的 push 才回推日志，主分支不能被 ci-log commit 污染（状态看 Actions 即可）。
#
# 与姊妹仓的差别：本仓有 split source sets（main + client），所以编译
# `compileJava compileClientJava` 两个目标；只编 main 会漏掉全部 GUI / 渲染器代码，
# 也会漏掉 compat/jei 与 compat/rei 两个可选适配器。

permissions:
  contents: write

on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.1.2-source'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: compile main + client source sets
        run: |
          mkdir -p build-reports
          {
            echo "commit: ${{ github.sha }}"
            echo "branch: ${{ github.ref_name }}"
            echo "minecraft: $(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)"
            echo "fabric-api: $(grep -E '^fabric_version=' gradle.properties | cut -d= -f2)"
            echo "loader: $(grep -E '^loader_version=' gradle.properties | cut -d= -f2)"
            echo "jei: $(grep -E '^enable_jei=' gradle.properties | cut -d= -f2) / $(grep -E '^jei_version=' gradle.properties | cut -d= -f2)"
            echo "rei: $(grep -E '^enable_rei=' gradle.properties | cut -d= -f2) / $(grep -E '^rei_version=' gradle.properties | cut -d= -f2)"
            echo "---"
          } > build-reports/compile-java.log
          ./gradlew compileJava compileClientJava --console=plain --stacktrace --no-daemon \
            >> build-reports/compile-java.log 2>&1
          status=$?
          echo "gradle exit code: $status" >> build-reports/compile-java.log
          exit $status

      - name: Push compile log back via contents API
        # 只在 arena/** 的 push 上回推 —— 主分支与 PR 不产生 ci-log commit
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 日志可能很大，只保留头 200 行 + 尾 800 行
          LOG=build-reports/compile-java.log
          LINES=$(wc -l < "$LOG")
          if [ "$LINES" -gt 1000 ]; then
            { head -n 200 "$LOG"; echo "...[truncated ${LINES} lines total]..."; tail -n 800 "$LOG"; } > /tmp/log-trimmed
            mv /tmp/log-trimmed "$LOG"
          fi
          echo "" >> "$LOG"
          echo "== job status: ${{ job.status }} ==" >> "$LOG"
          BRANCH="${{ github.ref_name }}"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                -f message="ci-log: compile result (${{ job.status }}) for ${{ github.sha }}"
                -f branch="$BRANCH"
                -f content="$(base64 -w0 "$LOG")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" --jq .commit.sha
