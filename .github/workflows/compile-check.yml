name: compile-check
# Compile-verification loop, ported from TaCZ_Refabricated_Unofficial (.github/workflows/compile-check.yml)
# via the 26.3 branch of this repository.
#
# 依赖下载与编译在 GitHub Actions（外网畅通）执行；arena/** 分支上，编译日志通过
# GitHub Contents API 写回本分支（build-reports/compile-java.log），供网络受限的沙箱
# 用 `gh api .../contents/build-reports/compile-java.log` 直接读取 —— 绕开 Actions
# 日志 blob 域不可达的限制。沙箱里 maven.fabricmc.net / piston-meta.mojang.com 不可达，
# ./gradlew 连依赖都解析不了，所以这是 26.1.2 这条线上唯一能「编译验证」的通道
# （26.3 分支同理，本文件与它逐字节对应，只有分支过滤与注释不同）。
#
# 沿用姊妹仓的三条教训：
#   * v2 用 git commit+push 回推，曾因 rebase/push 竞争连续失败 5 次 → 改用 Contents API 单文件写入；
#   * paths-ignore 'build-reports/**' 防止「日志回推 commit」再次触发本流程造成死循环；
#   * 只有 arena/** 的 push 才回推日志，主分支不能被 ci-log commit 污染（状态看 Actions 即可）。
#
# 与姊妹仓的差别：本仓有 split source sets（main + client），所以编译
# `compileJava compileClientJava` 两个目标；只编 main 会漏掉全部 GUI / 渲染器代码，
# 也会漏掉 compat/jei 与 compat/rei 两个可选适配器。

permissions:
  contents: write

on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.1.2-source'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: compile main + client source sets
        run: |
          mkdir -p build-reports
          chmod +x ./gradlew 2>/dev/null || true
          {
            echo "commit: ${{ github.sha }}"
            echo "branch: ${{ github.ref_name }}"
            echo "minecraft: $(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)"
            echo "fabric-api: $(grep -E '^fabric_version=' gradle.properties | cut -d= -f2)"
            echo "loader: $(grep -E '^loader_version=' gradle.properties | cut -d= -f2)"
            echo "jei: $(grep -E '^enable_jei=' gradle.properties | cut -d= -f2) / $(grep -E '^jei_version=' gradle.properties | cut -d= -f2)"
            echo "rei: $(grep -E '^enable_rei=' gradle.properties | cut -d= -f2) / $(grep -E '^rei_version=' gradle.properties | cut -d= -f2)"
            echo "---"
          } > build-reports/compile-java.log
          # Actions 的默认 shell 是 `bash -e`：裸写 `./gradlew ...` 后面跟 `status=$?` 是死代码，
          # 编译失败时脚本会在那一行直接退出（1.0.3 第一次失败的日志里就没有 exit code 行），
          # 下面的失败诊断也就永远不会生成。必须用 `|| status=$?` 把退出码接住。
          status=0
          ./gradlew compileJava compileClientJava --console=plain --stacktrace --no-daemon \
            >> build-reports/compile-java.log 2>&1 || status=$?
          echo "gradle exit code: $status" >> build-reports/compile-java.log
          # 把「浮动坐标」这次实际解析成了什么记进日志：jei_version=latest.release 与
          # rei_version=26.1.+ 都会随上游发布漂移，而沙箱读不到 maven，也读不到 Actions 的
          # 日志 blob。没有这一段，「昨天能编、今天不能编」无从追溯，也没法把它们钉成确切版本。
          {
            echo ""
            echo "=== resolved coordinates (compileClasspath / clientCompileClasspath) ==="
          } >> build-reports/compile-java.log
          for CFG in compileClasspath clientCompileClasspath; do
            echo "--- $CFG ---" >> build-reports/compile-java.log
            ./gradlew -q dependencies --configuration "$CFG" --console=plain --no-daemon 2>&1 \
              | grep -E "mezz\.jei|me\.shedaniel|dev\.architectury|net\.fabricmc|com\.mojang" \
              | sed -E 's/^[^A-Za-z]*//; s/ \(c\)$//; s/ \(\*\)$//' | sort -u \
              >> build-reports/compile-java.log || true
          done
          if [ "$status" -ne 0 ]; then
            # 失败时再回写一份依赖图。沙箱读不到 Actions 的日志 blob 域，build-reports/ 下的
            # 文件是唯一的排障通道，所以「为什么失败」也必须落盘，而不是只留在 run 页面里。
            # 经验教训（1.0.3 第一次 compile-check）：错误可能根本不在源码里 ——
            # 可选依赖（JEI / REI / architectury）的 POM 会把 fabric-api / loader / minecraft
            # 的版本顶掉，而 Loom 的 injected_interfaces 是按 fabric-api 的内容改写 Minecraft
            # 类的，于是 main 源集会报 "cannot access EntityFluidExtension"。
            DEPS=build-reports/compile-deps.log
            {
              echo "commit: ${{ github.sha }}"
              echo "branch: ${{ github.ref_name }}"
              echo "gradle exit code: $status"
              echo ""
              echo "=== dependencyInsight: net.fabricmc.fabric-api on compileClasspath ==="
            } > "$DEPS"
            ./gradlew -q dependencyInsight --configuration compileClasspath \
              --dependency net.fabricmc.fabric-api --console=plain --no-daemon >> "$DEPS" 2>&1 || true
            {
              echo ""
              echo "=== dependencyInsight: net.fabricmc.fabric-api on clientCompileClasspath ==="
            } >> "$DEPS"
            ./gradlew -q dependencyInsight --configuration clientCompileClasspath \
              --dependency net.fabricmc.fabric-api --console=plain --no-daemon >> "$DEPS" 2>&1 || true
            {
              echo ""
              echo "=== dependencies --configuration compileClasspath (first 400 lines) ==="
            } >> "$DEPS"
            ./gradlew -q dependencies --configuration compileClasspath --console=plain --no-daemon 2>&1 \
              | head -n 400 >> "$DEPS" || true
            {
              echo ""
              echo "=== dependencies --configuration clientCompileClasspath (first 400 lines) ==="
            } >> "$DEPS"
            ./gradlew -q dependencies --configuration clientCompileClasspath --console=plain --no-daemon 2>&1 \
              | head -n 400 >> "$DEPS" || true
          fi
          exit $status

      - name: Push compile log back via contents API
        # 只在 arena/** 的 push 上回推 —— 主分支与 PR 不产生 ci-log commit
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          # compile-deps.log 只在编译失败时存在；两个文件都走同样的「截断 + 单文件 PUT」流程
          for LOG in build-reports/compile-java.log build-reports/compile-deps.log; do
            [ -f "$LOG" ] || continue
            case "$LOG" in
              *compile-deps.log) KIND="dependency report" ;;
              *)                 KIND="compile result (${{ job.status }})" ;;
            esac
            # 日志可能很大，只保留头 200 行 + 尾 800 行
            LINES=$(wc -l < "$LOG")
            if [ "$LINES" -gt 1000 ]; then
              { head -n 200 "$LOG"; echo "...[truncated ${LINES} lines total]..."; tail -n 800 "$LOG"; } > /tmp/log-trimmed
              mv /tmp/log-trimmed "$LOG"
            fi
            echo "" >> "$LOG"
            echo "== job status: ${{ job.status }} ==" >> "$LOG"
            for attempt in 1 2 3 4; do
              SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
              ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                    -f message="ci-log: ${KIND} for ${{ github.sha }}"
                    -f branch="$BRANCH"
                    -f content="$(base64 -w0 "$LOG")")
              if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
              if gh api "${ARGS[@]}" --jq .commit.sha; then
                break
              fi
              sleep $((attempt * 2))
            done
          done
