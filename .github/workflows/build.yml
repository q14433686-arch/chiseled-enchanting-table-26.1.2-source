name: build
# Full build + artifact upload, ported from TaCZ_Refabricated_Unofficial (.github/workflows/build.yml)
# via the 26.3 branch of this repository, adapted to the 26.2 line.
#
# compile-check.yml 只跑 compileJava/compileClientJava，测不出 processResources / remapJar
# 阶段的失败，也不产 jar。本流程跑 ./gradlew build 并把 jar 上传为 Actions artifact（留 14 天）
# —— 直接用途：给需要实测的人一个下载链接；每轮改动随手有可实测的构建。
#
# 编译之前先跑三个便宜的静态校验（秒级，且不依赖 Gradle 能解析依赖）：
#   1. scripts/ci_static_checks.py  — mixin 配置完整性 + 「已注册 mixin 不能被 build.gradle 排除」+ 语言键齐平
#   2. scripts/compat_check.py      — 数据包 schema / JSON-Java 漂移（Tier 1 必须通过）
#   3. scripts/check_release_consistency.sh --strict — 版本号五处同步（gradle/README/fabric.mod.json/publish.yml）
# 这三个脚本在沙箱里也能跑（不需要外网），所以本地提交前就能自查。
#
# 与 26.3 分支的差别：多一个 no-viewers 编译 job。JEI/REI 在 26.2 这条线上是
# compileOnly 的可选依赖（gradle.properties: enable_jei / enable_rei），必须保证关掉它们之后
# client source set 仍然能编译 —— 那是 maven.blamejared.com / maven.shedaniel.me 不可达时的
# 唯一逃生通道，不能只在文档里写着「可以关」。
# 反过来，server-smoke job（2026-10-23 从 26.3 移植）是三条线共用的：静态检查与编译都盖不住
# 「世界能不能真的载入 / datapack 能不能 reload / loot function 是否真的执行」。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.2-source'
      - '26.2'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks (no network needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: mixin config integrity + registered-mixin-compiled + lang key parity
        run: python3 scripts/ci_static_checks.py

      - name: compatibility / data-pack sanity check
        run: python3 scripts/compat_check.py

      - name: version consistency
        run: bash scripts/check_release_consistency.sh --strict

  build:
    name: gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 名不能含 '/'，所以不能直接用 github.ref_name（arena/xxx 带斜杠，
          # 姊妹仓首跑就是这样失败的）。分支名在 run 页面本来就有，名字里只放 sha 前缀。
          name: chiseled-enchanting-table-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error

  no-viewers:
    # 逃生通道验证：JEI/REI 全部关掉时，client source set 仍必须编译通过。
    name: compile without JEI/REI (optional-dependency escape hatch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: compile main + client with both viewers disabled
        run: ./gradlew compileJava compileClientJava -Penable_jei=false -Penable_rei=false --console=plain --stacktrace --no-daemon

  server-smoke:
    permissions:
      contents: write
    name: real server world-load + datapack reload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      # 静态检查与编译都盖不住「世界能不能真的载入 / datapack 能不能 reload / loot function
      # 在真实游戏里是否生效」。本 job 用一次性 flat 世界跑 runServer（需 build.gradle 里
      # runServer 的 standardInput = System.in，脚本靠 stdin 发 reload/loot/stop），
      # 绝不对任何已有存档运行。
      - name: boot fresh world and reload datapacks
        run: python3 scripts/server_smoke.py

      - name: smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ github.sha }}
          path: |
            build-reports/server-smoke.log
            run/logs/latest.log
            run/crash-reports/**
          if-no-files-found: warn

      # 与 compile-check 同理：沙箱里读不到 Actions 日志 blob，只能靠 Contents API 把日志
      # 写回分支（paths-ignore 'build-reports/**' 保证不会自触发）。只在 arena/** 回推。
      - name: return smoke log to development branch
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYLOG'
          import base64, json, os, pathlib, subprocess
          path = pathlib.Path('build-reports/server-smoke.log')
          if path.exists():
              endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}"
              branch = os.environ['GITHUB_REF_NAME']
              old = subprocess.run(['gh', 'api', endpoint + '?ref=' + branch], capture_output=True, text=True)
              data = {'message': 'ci-log: server smoke for ' + os.environ['GITHUB_SHA'],
                      'branch': branch, 'content': base64.b64encode(path.read_bytes()[-150000:]).decode()}
              if old.returncode == 0:
                  data['sha'] = json.loads(old.stdout)['sha']
              subprocess.run(['gh', 'api', '-X', 'PUT', endpoint, '--input', '-'],
                             input=json.dumps(data), text=True, check=True, stdout=subprocess.DEVNULL)
          PYLOG
