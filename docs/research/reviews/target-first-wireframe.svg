<rect x="116" y="579" width="530" height="39" fill="#303c4b"/>
<text x="132" y="604" font-size="14">玩家物品区 / 现有布局安全区：实际位置需结合原界面核定</text>
<rect x="666" y="579" width="217" height="39" fill="#55503e"/>
