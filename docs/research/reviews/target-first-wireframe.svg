<text x="132" y="365" font-size="14" fill="#c1cedd">下一步：具体作业选择方式尚待审阅</text>
<text x="132" y="400" font-size="14" fill="#b1bdcc">试验效果与判据未实现，不假装按钮已可用</text>
<rect x="506" y="280" width="377" height="145" rx="5" fill="#303c4b"/>
