<rect x="116" y="446" width="767" height="54" fill="#202833"/>
<text x="133" y="479" font-size="16">观察记录  ▸    默认收起；显示已经观察到什么，不堆完整研究树</text>
<rect x="116" y="518" width="767" height="41" fill="#202833"/>
