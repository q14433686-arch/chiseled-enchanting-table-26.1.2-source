<rect x="322" y="85" width="100" height="30" fill="#6d5d3e"/><text x="350" y="106" font-size="15">研究</text>
<text x="116" y="150" font-size="18">我想稳定制造什么？</text>
<rect x="116" y="167" width="390" height="44" fill="#364151"/>
<text x="132" y="195" font-size="18">效率  ▾     通用路线  ▾     目标 Ⅱ  ▾</text>
<text x="530" y="193" font-size="15" fill="#bac6d5">成果：掌握稳定制造效率Ⅱ的方法</text>
