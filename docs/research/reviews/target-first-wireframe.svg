<text x="36" y="62" font-size="14" fill="#bdc5d0">不是游戏截图、最终尺寸或贴图；颜色仅用于区分区域。尚未实现游戏内页面。</text>
<rect x="90" y="115" width="820" height="525" rx="8" fill="#252c35" stroke="#718096"/>
