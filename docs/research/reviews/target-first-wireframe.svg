<text x="116" y="263" font-size="17">选择一条研究路径 · 任一路径完成即可</text>
<rect x="116" y="280" width="370" height="145" rx="5" fill="#303c4b" stroke="#b8c7d9"/>
<text x="132" y="308" font-size="18">作业试验</text>
