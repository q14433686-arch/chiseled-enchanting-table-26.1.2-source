name: compile-check
# 编译验证闭环 —— 移植自 TaCZ_Refabricated_Unofficial 的 compile-check.yml (v4)。
# 依赖下载与编译在 GitHub Actions（外网畅通）执行；arena/** 分支上，编译日志通过
# GitHub Contents API 写回本分支（build-reports/compile-java.log），供网络受限的
# 沙箱用 `gh api contents` 直接读取 —— 绕开 Actions 日志域不可达、maven.* 直连
# 不通的限制。沙箱内无 JDK，编译验证全部走这条通道。
# 只在 arena/** 的 push 上回推日志 —— 主分支与 PR 不产生 ci-log commit；
# paths-ignore 'build-reports/**' 防止「日志回推 commit」再次触发本流程造成死循环。
permissions:
  contents: write
on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.1.2-source'
      - '26.2'
      - '26.3'
      - '26.3(main)'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:
concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: compileJava + compileClientJava
        # 本仓 loom splitEnvironmentSourceSets：main 与 client 两个编译单元都要编。
        run: |
          mkdir -p build-reports
          echo "commit: ${{ github.sha }}" > build-reports/compile-java.log
          ./gradlew compileJava compileClientJava --console=plain --stacktrace --no-daemon >> build-reports/compile-java.log 2>&1
      - name: Push compile log back via contents API
        # 只在 arena/** 的 push 上回推 —— 主分支与 PR 不产生 ci-log commit
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 日志可能很大，只保留头 200 行 + 尾 800 行
          LOG=build-reports/compile-java.log
          LINES=$(wc -l < "$LOG")
          if [ "$LINES" -gt 1000 ]; then
            { head -n 200 "$LOG"; echo "...[truncated ${LINES} lines total]..."; tail -n 800 "$LOG"; } > /tmp/log-trimmed
            mv /tmp/log-trimmed "$LOG"
          fi
          echo "" >> "$LOG"
          echo "== job status: ${{ job.status }} ==" >> "$LOG"
          BRANCH="${{ github.ref_name }}"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                -f message="ci-log: compile result (${{ job.status }}) for ${{ github.sha }}"
                -f branch="$BRANCH"
                -f content="$(base64 -w0 "$LOG")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" --jq .commit.sha
