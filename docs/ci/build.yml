name: build
# Full build + artifact upload, ported from TaCZ_Refabricated_Unofficial (.github/workflows/build.yml).
#
# compile-check.yml 只跑 compileJava/compileClientJava，测不出 processResources / remapJar
# 阶段的失败，也不产 jar。本流程跑 ./gradlew build 并把 jar 上传为 Actions artifact（留 14 天）
# —— 直接用途：给需要实测的人一个下载链接；每轮改动随手有可实测的构建。
#
# 编译之前先跑四个便宜的静态校验（秒级，且不依赖 Gradle 能解析依赖）：
#   1. scripts/ci_static_checks.py  — mixin 配置完整性 + 「已注册 mixin 不能被 build.gradle 排除」+ 中英语言键齐平
#   2. scripts/compat_check.py      — 数据包 schema / JSON-Java 漂移（Tier 1 必须通过）
#   3. scripts/check_release_consistency.sh --strict — 版本号五处同步（gradle/README/fabric.mod.json/publish.yml）
# 这三个脚本在沙箱里也能跑（不需要外网），所以本地提交前就能自查。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.1.2-source'
      - '26.**'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks (no network needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: mixin config integrity + registered-mixin-compiled + lang key parity
        run: python3 scripts/ci_static_checks.py

      - name: compatibility / data-pack sanity check
        run: python3 scripts/compat_check.py

      - name: version consistency
        run: bash scripts/check_release_consistency.sh --strict

  build:
    name: gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 名不能含 '/'，所以不能直接用 github.ref_name（arena/xxx 带斜杠，
          # 姊妹仓首跑就是这样失败的）。分支名在 run 页面本来就有，名字里只放 sha 前缀。
          name: chiseled-enchanting-table-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error
