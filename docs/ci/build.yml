# 全量构建 + 产物上传 + 三个静态校验。
# 移植自 TaCZ_Refabricated_Unofficial 的 build.yml，静态校验按本仓情况改写：
#   1. Mixin config integrity — mixins json 列出的类必须真实存在（main / client
#      两个 source set 都查），且每个 *mixins*.json 必须在 fabric.mod.json 注册
#      （孤儿 mixin 配置永不生效，TaCZ 1.21.11 线踩过）。
#   2. Lang key parity — en_us 与 zh_cn 键集合必须一致。
#   3. Version consistency — scripts/check_release_consistency.sh（与
#      consistency.yml 同一脚本，arena 分支也守门）。
#   4. Data-pack sanity — scripts/compat_check.py（本仓 Tier-1 离线数据包检查）。
# compile-check 只跑 compileJava，测不出 processResources / remapJar 阶段的失败，
# 也不产 jar。本流程跑 ./gradlew build 并把 jar 上传为 Actions artifact（留 14 天）。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - 'chiseled-enchanting-table-26.1.2-source'
      - '26.2'
      - '26.3'
      - '26.3(main)'
      - 'main'
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mixin config integrity (json 里列的类必须真实存在且已注册)
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          bad = []
          # resource root -> java source root（loom splitEnvironmentSourceSets）
          roots = [('src/main/resources', 'src/main/java'), ('src/client/resources', 'src/client/java')]
          configs = []
          for res_root, java_root in roots:
              for cfg in sorted(glob.glob(res_root + '/*mixins*.json')):
                  configs.append(os.path.basename(cfg))
                  d = json.load(open(cfg))
                  pkg = d.get('package', '').replace('.', '/')
                  for section in ('mixins', 'client', 'server'):
                      for m in d.get(section, []):
                          p = java_root + '/' + pkg + '/' + m.replace('.', '/') + '.java'
                          if not os.path.exists(p):
                              bad.append(f'{cfg}: {m} -> {p} 不存在')
          # 孤儿配置检查：每个 *mixins*.json 都必须在 fabric.mod.json 的 mixins 列表里
          fmj = json.load(open('src/main/resources/fabric.mod.json'))
          registered = set(fmj.get('mixins', []))
          for c in configs:
              if c not in registered:
                  bad.append(f'{c}: 未在 fabric.mod.json "mixins" 中注册（孤儿 mixin 配置永不生效）')
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          EOF

      - name: Lang key parity (en_us 与 zh_cn 键集合必须一致)
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          bad = []
          seen = False
          for base in sorted(glob.glob('src/*/resources/assets/*/lang/')):
              en_path, zh_path = base + 'en_us.json', base + 'zh_cn.json'
              if not (os.path.exists(en_path) and os.path.exists(zh_path)):
                  continue
              seen = True
              ns = base.split('/')[-3]
              en = set(json.load(open(en_path)))
              zh = set(json.load(open(zh_path)))
              for k in sorted(en - zh):
                  bad.append(f'{ns}: {k} 只在 en_us')
              for k in sorted(zh - en):
                  bad.append(f'{ns}: {k} 只在 zh_cn')
          if not seen:
              print('::warning::未找到任何成对的 en_us/zh_cn 语言文件，跳过')
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          EOF

      - name: Version consistency (与 consistency.yml 同一脚本，arena 分支也守门)
        run: bash scripts/check_release_consistency.sh

      - name: Data-pack sanity (Tier 1)
        run: python3 scripts/compat_check.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Full build
        run: ./gradlew build --console=plain --stacktrace --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          # 注意:artifact 名不能含 '/' 等字符,所以这里不能用 github.ref_name
          # (arena/xxx 带斜杠)。分支名在 run 页面本来就有,名字里只放 sha 前缀即可。
          name: chiseled-enchanting-table-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error
