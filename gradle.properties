# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.3 line: Minecraft 26.3 (stable), loader 0.19.5 (latest release, 2026-08-28),
# Fabric API 0.162.0+26.3 (latest 26.3 release, 2026-10-06).
minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version=1.1.0
maven_group=chiseled_enchanting_table
archives_base_name=chiseled-enchanting-table

# Dependencies
fabric_version=0.162.0+26.3

# Optional recipe-viewer integration (client-only, never a hard dependency).
# JEI's API is compileOnly: the plugin classes are excluded from compilation when the property is
# false, which is the escape hatch for a sandbox/CI that cannot reach maven.blamejared.com.
enable_jei=true
# JEI publishes per-Minecraft-version artifacts to maven.blamejared.com. `latest.release` picks the
# newest published build for 26.3; pin an exact version here once it is verified in CI.
jei_version=latest.release
# REI: same gating as JEI. The API artifact alone is not enough to compile against REI — its
# interfaces leak me.shedaniel.math (Point/Rectangle) and dev.architectury fluid types, so the two
# libraries below are added as compile-only dependencies as well. All three are provided by REI at
# runtime; none of them is bundled or required by this mod.
# See docs/reports/VIEWER_INTEGRATION_JEI_REI.md §4.
enable_rei=true
# REI publishes per-version artifacts (base_version.buildNumber) to maven.shedaniel.me; the 26.3 line
# exists upstream. `26.3.+` resolves the newest build for this Minecraft version.
rei_version=26.3.+
# cloth basic-math: the source of me.shedaniel.math (Point/Rectangle).
rei_math_version=0.6.1
# Architectury API for 26.3: REI 26.3 builds against 22.0.x.
rei_architectury_version=22.0.3
