# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.1.2 line: these three stay exactly as verified for the 1.0.2 build (Minecraft 26.1.2,
# loader 0.19.3, Fabric API 0.151.0+26.1.2). The 26.3 branch moved to loader 0.19.5 /
# Fabric API 0.162.0+26.3 / Loom 1.17 because *that* Minecraft line needs them; nothing in the
# 26.3 sync (deadlock fix, cost sync, JEI/REI, i18n, CI) requires a newer toolchain here, and
# bumping it blind — with no maven access in the dev sandbox — would trade a verified build for an
# unverified one. See docs/reports/SYNC_FROM_26_3_REPORT.md §6.
minecraft_version=26.1.2
loader_version=0.19.3

# Mod Properties
# 1.0.3 = the 26.3-side fixes/features back-ported to this line (worldgen deadlock, server-cost
# sync, JEI + REI, 11 languages, CI triad). Same SemVer as the 26.3 branch's 1.0.3 on purpose, so
# "which feature set is this" is answerable from the version alone across the three branches.
mod_version=1.0.3
maven_group=chiseled_enchanting_table
archives_base_name=chiseled-enchanting-table

# Dependencies
fabric_version=0.151.0+26.1.2

# Optional recipe-viewer integration (client-only, never a hard dependency).
# JEI's API is compileOnly: the plugin classes are excluded from compilation when the property is
# false, which is the escape hatch for a sandbox/CI that cannot reach maven.blamejared.com.
enable_jei=true
# JEI publishes per-Minecraft-version artifacts to maven.blamejared.com as
# `mezz.jei:jei-<minecraft_version>-fabric`, i.e. `jei-26.1.2-fabric` here. JEI's own `26.1`
# branch pins `minecraftVersion=26.1.2` (gradle.properties@26.1) and names the publication
# "${modId}-${minecraftVersion}-fabric" (Fabric/build.gradle.kts@26.1), so the interpolation below
# resolves to a real coordinate.
# Pinned, not floating: `latest.release` resolved to 29.47.0.111 in CI on 2026-10-21 (run
# 39668301472 — compile-check now records the resolved coordinates in
# build-reports/compile-java.log). A floating *compile-only* coordinate is a build break that
# arrives without any commit here: JEI's `26.1` branch has already deleted
# IIngredientAcceptor#addItemStack, which the category still calls (it is deprecated-for-removal in
# 29.47.0.111, hence the two javac warnings). Bump deliberately and migrate the call sites in the
# same commit — see docs/reports/VIEWER_INTEGRATION_JEI_REI.md §6.
jei_version=29.47.0.111
# REI: same gating as JEI. The API artifact alone is not enough to compile against REI — its
# interfaces leak me.shedaniel.math (Point/Rectangle) and dev.architectury fluid types, so the two
# libraries below are added as compile-only dependencies as well. All three are provided by REI at
# runtime; none of them is bundled or required by this mod.
# See docs/reports/VIEWER_INTEGRATION_JEI_REI.md §4.
enable_rei=true
# REI publishes per-version artifacts (base_version.buildNumber) to maven.shedaniel.me. Its `26.1`
# branch sets `base_version=26.1` / `minecraft_version=26.1.2`, so `26.1.x` is this line's prefix
# (the 26.3 branch uses `26.3.+`). REI's api/build.gradle and settings.gradle are byte-identical
# between those two branches, so only the version prefix differs.
# Pinned for the same reason as JEI: `26.1.+` resolved to 26.1.819 in CI on 2026-10-21.
rei_version=26.1.819
# cloth basic-math: the source of me.shedaniel.math (Point/Rectangle). CI confirmed the coordinate
# exists and resolves (0.6.1, run 39668301472) — it was unverified until then.
rei_math_version=0.6.1
# Architectury API: REI's 26.1 branch builds against 20.0.6 (`architectury_version` in its
# gradle.properties); the 26.3 branch uses 22.0.3. Compile-only — REI ships it at runtime.
rei_architectury_version=20.0.6
