# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
# 1.0.3 = the 26.3-side fixes/features synced to the 26.2 line (worldgen deadlock, server-cost
# sync, JEI + REI, 11 languages, CI triad), plus the 26.1.2 sister-branch fixes (viewer
# toolchainPins exclusions, dropped redundant JEI enchanted-book subtype registration, and
# bash -e-safe compile-check status capture).
# 1.1.0 = the 26.1.2-line progression / economy / UI overhaul synced on top of that (two-track
# library progression, Library Resonance, dual-mode XP, yield-aware cost curves, Treasure Epiphany,
# Depleted Tome loop, bidirectional JEI/REI transformations). Minor bump: large feature addition,
# no breaking change to the mod id, data-pack paths or existing world saves.
mod_version=1.1.0
maven_group=chiseled_enchanting_table
archives_base_name=chiseled-enchanting-table

# Dependencies
fabric_version=0.155.2+26.2

# Optional recipe-viewer integration (client-only, never a hard dependency).
# JEI's API is compileOnly: the plugin classes are excluded from compilation when the property is
# false, which is the escape hatch for a sandbox/CI that cannot reach maven.blamejared.com.
enable_jei=true
# JEI publishes per-Minecraft-version artifacts to maven.blamejared.com as
# `mezz.jei:jei-<minecraft_version>-fabric` (i.e. `jei-26.2-fabric` on the 26.2 line).
# Pinned, not floating: `latest.release` resolved to 30.47.0.239 in CI on 2026-10-22 (compile
# check run 119488382287 — compile-check records the resolved coordinates in
# build-reports/compile-java.log). In 30.47.0.239, IIngredientAcceptor#addItemStack is
# @Deprecated(forRemoval = true), producing two javac warnings; bump deliberately and migrate the
# call sites in the same commit — see docs/reports/VIEWER_INTEGRATION_JEI_REI.md §6.
jei_version=30.47.0.239
# REI: same gating as JEI. The API artifact alone is not enough to compile against REI — its
# interfaces leak me.shedaniel.math (Point/Rectangle) and dev.architectury fluid types, so the two
# libraries below are added as compile-only dependencies as well. All three are provided by REI at
# runtime; none of them is bundled or required by this mod.
# See docs/reports/VIEWER_INTEGRATION_JEI_REI.md §4.
enable_rei=true
# REI publishes per-version artifacts (base_version.buildNumber) to maven.shedaniel.me.
# Pinned for the same reason as JEI: `26.2.+` resolved to 26.2.821 in CI on 2026-10-22.
rei_version=26.2.821
# cloth basic-math: the source of me.shedaniel.math (Point/Rectangle).
rei_math_version=0.6.1
# Architectury API: REI's 26.2 branch builds against 21.0.4 (`architectury_version` in its
# gradle.properties). Compile-only — REI ships it at runtime.
rei_architectury_version=21.0.4
