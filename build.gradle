plugins {
    // 26.3: Loom stays on the 1.17 line — pinned to concrete release 1.17.21 on maven.fabricmc.net
    // instead of a floating 1.17-SNAPSHOT for reproducible builds.
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    // JEI publishes `mezz.jei:jei-<mc>-fabric` here (verified against JEI's own buildSrc:
    // JeiProject.kt adds exactly this repository for its plugin builds).
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev' }
}

/** Optional viewer integration toggles (see gradle.properties). */
def jeiEnabled = project.findProperty('enable_jei') != 'false'
def reiEnabled = project.findProperty('enable_rei') != 'false'

/**
 * Dependency-configuration closure for the optional recipe viewers: a viewer's POM must never move
 * *this* mod's toolchain. Minecraft, fabric-loader and Fabric API are pinned above, and Fabric API
 * is load-bearing at compile time in a way that is easy to miss — Loom reads the
 * `injected_interfaces` declared by fabric-api's modules and rewrites the Minecraft classes
 * accordingly (e.g. `Entity implements net.fabricmc.fabric.api.registry.fluid.EntityFluidExtension`,
 * from `fabric-content-registries-v0`). If a viewer transitively upgrades fabric-api to a build for
 * a different Minecraft version, javac sees interfaces the resolved jar no longer supplies and the
 * *main* source set dies with "cannot access EntityFluidExtension / class file ... not found".
 *
 * This branch compiles green *without* the exclusions only because its own fabric-api
 * 0.162.0+26.3 already wins the version conflict — i.e. by accident of being the newest Minecraft
 * line, not by design. The 26.1.2 sister branch hit exactly that failure as soon as the viewers were
 * added (its docs/reports/SYNC_FROM_26_3_REPORT.md §8 finding 7), so the pins are applied here as
 * well: the next viewer release, or a REI build that bumps its architectury baseline, can no longer
 * change which Fabric API javac compiles against.
 */
def toolchainPins = {
    exclude group: 'net.fabricmc.fabric-api'   // Fabric API: pinned by this build (fabric_version)
    exclude group: 'net.fabricmc'              // fabric-loader / intermediary: pinned above
    exclude group: 'com.mojang'                // Minecraft + Mojang libraries: provided by Loom
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "chiseled-enchanting-table" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java {
            // Optional JEI / REI integrations. Excluded when `-Penable_jei=false` / `-Penable_rei=false`
            // so an environment that cannot resolve optional viewer mavens still builds cleanly.
            if (!jeiEnabled) {
                exclude 'chiseled_enchanting_table/compat/jei/**'
            }
            if (!reiEnabled) {
                exclude 'chiseled_enchanting_table/compat/rei/**'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (jeiEnabled) {
        // compileOnly by design: JEI is never required at runtime, the plugin is only loaded
        // through the `jei_mod_plugin` entrypoint when JEI itself is installed.
        // Plain `compileOnly` (not `modCompileOnly`): the 26.x lines are unobfuscated — this repo
        // already puts fabric-api on `implementation` for the same reason — so there is nothing to
        // remap, and Loom 1.17 does not even create the `modCompileOnly` configuration here.
        compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}", toolchainPins)
    }

    if (reiEnabled) {
        // Same rationale as JEI: compileOnly, unobfuscated 26.x line.
        compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}", toolchainPins)
        // REI's api artifact does not re-export two libraries its own interfaces leak:
        //   - me.shedaniel.math (Point/Rectangle), from shedaniel's cloth basic-math;
        //   - dev.architectury (fluid types referenced by EntryStack/EntryStacks).
        // REI ships both at runtime, so they are compile-time only here as well.
        compileOnly("me.shedaniel.cloth:basic-math:${project.rei_math_version}", toolchainPins)
        compileOnly("dev.architectury:architectury-fabric:${project.rei_architectury_version}", toolchainPins)
    }
}

// Headless economy/configuration verification imported from the 26.1.2 line.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "jeiEnabled", jeiEnabled
    inputs.property "reiEnabled", reiEnabled

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    // API-03: a jar built with -Penable_jei=false / -Penable_rei=false excludes the plugin
    // classes, so it must not keep advertising their entrypoints either (JEI/REI would try
    // to instantiate missing classes when such a jar runs alongside them).
    doLast {
        if (!jeiEnabled || !reiEnabled) {
            def f = file("$destinationDir/fabric.mod.json")
            def json = new groovy.json.JsonSlurper().parse(f)
            if (!jeiEnabled) {
                json.entrypoints?.remove('jei_mod_plugin')
            }
            if (!reiEnabled) {
                json.entrypoints?.remove('rei_client')
            }
            f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + "\n"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.3 still requires Java 25 (Fabric API 0.162.0+26.3 depends on java >=25).
    options.release = 25
    options.encoding = 'UTF-8'
    // Surface deprecated-API usage in CI logs immediately (audit: client entrypoint
    // currently "uses or overrides a deprecated API"); unchecked stays visible too.
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// The isolated CI smoke test sends reload/stop through the real dedicated-server console.
tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

// Compile-only Mod Menu API shim must not leak into either distributable.
tasks.withType(Jar).configureEach {
    exclude 'com/terraformersmc/**'
}

// Regenerate BundledDefaults.java from the datapack JSON (single source of truth).
// Deliberately NOT wired into compileJava: the generated file is checked in and the
// CI freshness gate (scripts/ci_static_checks.py) fails if it drifts from the JSON.
tasks.register('genBundledDefaults', Exec) {
    description = 'Regenerate BundledDefaults.java from datapack JSON defaults'
    group = 'codegen'
    workingDir = rootProject.projectDir
    commandLine 'python3', 'scripts/gen_bundled_defaults.py'
}

// Opt-in, separate development-only mod: never packaged in the released main/client jar.
if (providers.gradleProperty('client_smoke').orNull == 'true') {
    sourceSets {
        clientSmoke {
            compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.client.runtimeClasspath
        }
    }
    loom.mods {
        'cet-client-smoke' { sourceSet sourceSets.clientSmoke }
    }
    loom.runs {
        clientSmoke {
            client()
            source sourceSets.clientSmoke
            runDir 'run-client-smoke'
            vmArg '-Dcet.research.prototype=true'
            programArg '--quickPlaySingleplayer'
            programArg 'audit-world'
            programArg '--width'
            programArg '960'
            programArg '--height'
            programArg '640'
        }
    }
}
