plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev' }
}

def jeiEnabled = project.findProperty('enable_jei') != 'false'
def reiEnabled = project.findProperty('enable_rei') != 'false'

def toolchainPins = {
    exclude group: 'net.fabricmc.fabric-api'
    exclude group: 'net.fabricmc'
    exclude group: 'com.mojang'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "enchantment_fusion" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java {
            if (!jeiEnabled) {
                exclude 'enchantment_fusion/compat/jei/**'
            }
            if (!reiEnabled) {
                exclude 'enchantment_fusion/compat/rei/**'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (jeiEnabled) {
        compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}", toolchainPins)
    }

    if (reiEnabled) {
        compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}", toolchainPins)
        compileOnly("me.shedaniel.cloth:basic-math:${project.rei_math_version}", toolchainPins)
        compileOnly("dev.architectury:architectury-fabric:${project.rei_architectury_version}", toolchainPins)
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.named('compileClientJava') {
    finalizedBy(tasks.named('test'))
}

processResources {
    inputs.property "version", project.version
    inputs.property "jeiEnabled", jeiEnabled
    inputs.property "reiEnabled", reiEnabled

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    doLast {
        if (!jeiEnabled || !reiEnabled) {
            def outFmj = layout.buildDirectory.file("resources/main/fabric.mod.json").get().asFile
            if (outFmj.isFile()) {
                String txt = outFmj.getText('UTF-8')
                if (!jeiEnabled) {
                    txt = txt.replaceAll(',\\s*"jei_mod_plugin"\\s*:\\s*\\[[^\\]]*\\]', '')
                }
                if (!reiEnabled) {
                    txt = txt.replaceAll(',\\s*"rei_client"\\s*:\\s*\\[[^\\]]*\\]', '')
                }
                outFmj.setText(txt, 'UTF-8')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    // Compile-only ModMenu API shim: never ship com.terraformersmc.* in binary or sources JARs.
    exclude 'com/terraformersmc/**'
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

if (providers.gradleProperty('client_smoke').orNull == 'true') {
    sourceSets {
        clientSmoke {
            compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.client.runtimeClasspath
        }
    }
    loom.mods {
        'ef-client-smoke' { sourceSet sourceSets.clientSmoke }
    }
    loom.runs {
        clientSmoke {
            client()
            source sourceSets.clientSmoke
            runDir 'run-client-smoke'
            programArg '--quickPlaySingleplayer'
            programArg 'audit-world'
            programArg '--width'
            programArg '960'
            programArg '--height'
            programArg '640'
        }
    }
}
